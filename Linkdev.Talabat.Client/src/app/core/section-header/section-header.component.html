<ng-container *ngIf="(breadcrumbs$ | async) as breadcrumbs">
    <section *ngIf="breadcrumbs.length > 0" class="py-5" style="margin-top: 105px; background-color: #f5f5f5;">
        <div class="container">
            <div class="row d-flex align-items-center">
                <div class="col-9">
                    <h1>{{breadcrumbs[breadcrumbs.length-1].label | titlecase}}</h1>
                </div>
                <div class="col-3">
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item">
                                <a routerLink="/">Home</a>
                            </li>
                            <li *ngFor="let breadcrumb of breadcrumbs" class="breadcrumb-item" [class.active]="breadcrumb === breadcrumbs[breadcrumbs.length-1]">
                                <a *ngIf="breadcrumb !== breadcrumbs[breadcrumbs.length-1]" [routerLink]="breadcrumb.url">
                                    {{breadcrumb.label | titlecase}}
                                </a>
                                <span *ngIf="breadcrumb === breadcrumbs[breadcrumbs.length-1]">
                                    {{breadcrumb.label | titlecase}}
                                </span>
                            </li>
                        </ol>
                    </nav>
                </div>
            </div>
        </div>
    </section>
</ng-container>
